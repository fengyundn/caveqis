# Include these locations INSIDE your existing domain's server { } block.
# Preserve the existing listen, TLS, and other site settings.
location = /tools {
    return 301 /tools/;
}

location /tools/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Exactly one trusted proxy; overwrite headers supplied by clients.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    client_max_body_size 24k;
}
